{{- $values := .Values | toJson | fromJson -}}
{{- $auth := dict "clientSecret" (coalesce .Values.auth.clientSecret (dig "global" "auth" "clientSecret" "" $values)) -}}
{{- $secret := dict "enabled" (.Values.secret.enabled | default true) "name" (printf "%s-secrets" (include "dashboard.fullname" .)) -}}
{{- include "netbird-dashboard-lib.secret" (dict "root" . "values" .Values "fullname" (include "dashboard.fullname" .) "labels" (include "dashboard.labels" .) "auth" $auth "secret" $secret) }}
