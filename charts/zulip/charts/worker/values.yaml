enabled: true
replicas: 1
appName: zulip
fullnameOverride: ""
serviceAccountName: ""
image: {}
imagePullSecrets: []
podLabels: {}
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
sidecars: []
dependencyGuard:
  enabled: true
  attempts: 120
  sleepSeconds: 5
sharedEnv:
  configMapName: ""
  secretName: ""
connections:
  postgresql:
    passwordFromSecret: true
    passwordSecretName: ""
    passwordKey: password
  rabbitmq:
    usernameFromSecret: true
    usernameSecretName: ""
    usernameKey: username
    passwordFromSecret: true
    passwordSecretName: ""
    passwordKey: password
  redis:
    passwordFromSecret: false
    passwordSecretName: ""
    passwordKey: redis-password
config: {}
secrets: {}
extraEnv: []
queues:
  - deferred_work
  - digest_emails
  - email_mirror
  - embed_links
  - embedded_bots
  - email_senders
  - deferred_email_senders
  - missedmessage_emails
  - missedmessage_mobile_notifications
  - outgoing_webhooks
  - thumbnail
  - user_activity
  - user_activity_interval
groups:
  default:
    queues:
      - deferred_work
      - digest_emails
      - email_mirror
      - embed_links
      - embedded_bots
      - email_senders
      - deferred_email_senders
      - missedmessage_emails
      - missedmessage_mobile_notifications
      - outgoing_webhooks
      - thumbnail
      - user_activity
      - user_activity_interval
    resources: {}
shards:
  mobileNotifications: 1
  userActivity: 1
service:
  enabled: false
  type: ClusterIP
  port: 80
  annotations: {}
