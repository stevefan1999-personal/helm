enabled: true
replicas: 1
appName: zulip
fullnameOverride: ""
serviceAccountName: ""
image: {}
imagePullSecrets: []
podLabels: {}
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
sidecars: []
dependencyGuard:
  enabled: true
  attempts: 120
  sleepSeconds: 5
sharedEnv:
  configMapName: ""
  secretName: ""
connections:
  postgresql:
    passwordFromSecret: true
    passwordSecretName: ""
    passwordKey: password
  rabbitmq:
    usernameFromSecret: true
    usernameSecretName: ""
    usernameKey: username
    passwordFromSecret: true
    passwordSecretName: ""
    passwordKey: password
  redis:
    passwordFromSecret: false
    passwordSecretName: ""
    passwordKey: redis-password
config: {}
secrets: {}
extraEnv: []
gateway:
  replicas: 1
  containerPort: 80
  resources: {}
django:
  replicas: 1
  port: 8080
  uwsgiProcesses: 2
  uwsgiListenBacklog: 128
  harakiri: 55
  resources: {}
  podLabels: {}
  podAnnotations: {}
  service:
    enabled: true
    port: 8080
    annotations: {}
tusd:
  enabled: false
  port: 9900
  resources: {}
  service:
    port: 9900
katex:
  enabled: false
  port: 9700
  resources: {}
camo:
  enabled: false
tornadoProxy:
  image:
    repository: alpine/socat
    tag: "1.8.0.3"
    pullPolicy: IfNotPresent
  ports:
    - 9800
  servicePrefix: ""
  resources: {}
service:
  enabled: true
  name: ""
  type: ClusterIP
  port: 80
  targetPort: http
  annotations: {}
ingress:
  enabled: false
  name: ""
  annotations: {}
  hosts:
    - host: zulip.example.com
      paths:
        - path: /
  tls: []
  className: ""
livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1
probeHost: zulip.example.com
