{{- if eq (include "tuwunel.hasGeneratedSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tuwunel.secretName" . }}
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.registration.enabled .Values.registration.token }}
  registration_token: {{ .Values.registration.token | quote }}
  {{- end }}
  {{- if and .Values.jwt.enabled .Values.jwt.key }}
  jwt_key: {{ .Values.jwt.key | quote }}
  {{- end }}
  {{- if .Values.turn.secret }}
  turn_secret: {{ .Values.turn.secret | quote }}
  {{- end }}
  {{- if .Values.mediaStorage.s3.enabled }}
  s3_access_key: {{ include "tuwunel.s3AccessKey" . | quote }}
  s3_secret_key: {{ include "tuwunel.s3SecretKey" . | quote }}
  {{- end }}
  {{- if .Values.oidc.enabled }}
  {{- range $i, $provider := .Values.oidc.providers }}
  {{- if $provider.clientSecret }}
  idp-{{ $i }}-client-secret: {{ $provider.clientSecret | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
