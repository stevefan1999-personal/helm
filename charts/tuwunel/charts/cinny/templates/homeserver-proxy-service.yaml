{{- if and .Values.enabled .Values.homeserverProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cinny.homeserverProxyName" . }}
  labels:
    {{- include "cinny.homeserverProxyLabels" . | nindent 4 }}
  {{- with .Values.homeserverProxy.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.homeserverProxy.service.type }}
  ports:
    - name: http
      port: {{ .Values.homeserverProxy.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.homeserverProxy.service.type "NodePort") .Values.homeserverProxy.service.nodePort }}
      nodePort: {{ .Values.homeserverProxy.service.nodePort }}
      {{- end }}
  selector:
    {{- include "cinny.homeserverProxySelectorLabels" . | nindent 4 }}
{{- end }}
