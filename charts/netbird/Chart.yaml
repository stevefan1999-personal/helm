apiVersion: v2
name: netbird
description: A Helm chart for NetBird
type: application
version: 0.4.0
appVersion: "0.70.4"
dependencies:
- name: dashboard
  version: "0.3.0"
  condition: dashboard.enabled
- name: management
  version: "0.3.0"
  condition: management.enabled
- name: signal
  version: "0.3.0"
  condition: signal.enabled
- name: relay
  version: "0.3.0"
  condition: relay.enabled
- name: proxy
  version: "0.3.0"
  condition: proxy.enabled
