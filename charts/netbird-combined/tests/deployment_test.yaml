suite: NetBird Combined Deployment
templates:
  - templates/deployment.yaml
release:
  name: nb
  namespace: default
tests:
  - it: renders server and dashboard containers by default
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: nb-server
      - equal:
          path: spec.strategy.type
          value: Recreate
      - exists:
          path: spec.template.metadata.annotations["checksum/dashboard-config"]
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[0].name
          value: netbird-server
      - equal:
          path: spec.template.spec.containers[1].name
          value: dashboard
      - notContains:
          path: spec.template.spec.containers
          content:
            name: proxy
          any: true

  - it: adds the proxy as a sidecar when proxy is enabled
    set:
      proxy.enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 3
      - equal:
          path: spec.template.spec.containers[2].name
          value: proxy
      - equal:
          path: spec.template.spec.serviceAccountName
          value: nb-proxy
      - contains:
          path: spec.template.spec.containers[2].env
          content:
            name: NB_PROXY_MANAGEMENT_ADDRESS
            value: http://127.0.0.1:443
      - contains:
          path: spec.template.spec.volumes
          content:
            name: proxy-certs
            persistentVolumeClaim:
              claimName: nb-proxy-certs

  - it: exposes ACME http-01 and extra L4 ports on the proxy sidecar
    values:
      - proxy-extra-ports-values.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[2].ports
          content:
            name: proxy-acme
            containerPort: 80
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[2].ports
          content:
            name: tcp-5432
            containerPort: 5432
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[2].ports
          content:
            name: udp-51820
            containerPort: 51820
            protocol: UDP

  - it: allows overriding the deployment strategy when desired
    set:
      server.strategy.type: RollingUpdate
      server.strategy.rollingUpdate.maxUnavailable: 1
      server.strategy.rollingUpdate.maxSurge: 0
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 1
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 0

  - it: does not render the server pod when server is disabled
    set:
      server.enabled: false
    asserts:
      - hasDocuments:
          count: 0
