# Proxy subchart configuration
# Exposes internal services to the public internet via the NetBird mesh.
# Requires a proxy token created via: netbird-server token create --name "my-proxy"
enabled: false
replicas: 1

image:
  repository: "netbirdio/reverse-proxy"
  tag: "0.70.4"
  pullPolicy: IfNotPresent

securityContext: {}
podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  # Used for ACME certificate locking with Kubernetes Leases.
  create: true
  name: ""
  automountServiceAccountToken: true
  annotations: {}

rbac:
  # Grants coordination.k8s.io Lease access when ACME locking uses k8s-lease/auto.
  create: true

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# Public domain for the proxy cluster.
# All proxy instances with the same domain form a cluster.
# Wildcard DNS (*.domain) should point to this proxy.
domain: ""

# Bearer token for management server authentication (nbx_...).
# Generate via: kubectl exec deploy/<release>-server -- netbird-server token create --name "proxy" --config /etc/netbird/config.yaml
token: ""

# Reference an existing secret for the proxy token.
# The secret must contain a key named NB_PROXY_TOKEN.
existingSecret: ""

# Allow insecure (non-TLS) connection to management server.
# Required when proxy connects to management over internal K8s network (http://).
allowInsecure: true

# TLS mode for the proxy itself.
# The proxy handles its own TLS - it needs either ACME or static certs.
# For Cloudflare/external TLS termination, use ACME with http-01 challenge
# or provide static wildcard certs.
tls:
  # ACME (Let's Encrypt) - proxy auto-provisions certs.
  acme:
    enabled: true
    # tls-alpn-01: works when proxy has direct port 443 access.
    # http-01: use when behind Cloudflare or other CDN that blocks ALPN.
    challengeType: "tls-alpn-01"
    # For http-01, the ACME HTTP server listens on this port.
    httpPort: 80
    # Service port exposed for http-01 challenges.
    servicePort: 80
    # ACME directory URL (default: Let's Encrypt production).
    directory: ""
    # External Account Binding (for ZeroSSL, etc).
    eabKeyId: ""
    eabHmacKey: ""
  # Static certificates (alternative to ACME).
  # Provide wildcard certs for *.domain if using custom domains.
  static:
    certFile: ""
    keyFile: ""
  # cert-manager: use an existing K8s TLS secret (alternative to ACME/static).
  # The proxy will watch this cert for changes.
  certManager:
    secretName: ""

# Forwarded proto detection: auto, http, https.
# Set to "https" when behind a TLS-terminating proxy (Cloudflare, AWS ALB).
# For Cloudflare proxied DNS (orange cloud), use "https".
forwardedProto: "https"

# Trusted upstream proxy CIDRs (comma-separated).
# Set when behind Cloudflare, AWS ALB, or other load balancer.
trustedProxies: ""

# Enable the proxy debug HTTP endpoint.
debugEndpoint:
  enabled: false
  address: "localhost:8444"

# Certificate lock method for multi-replica ACME coordination: auto, flock, or k8s-lease.
certLockMethod: "auto"

# Directory containing wildcard certificate pairs (<name>.crt/<name>.key).
wildcardCertDir: ""

# WireGuard listen port (0=random). Fixed ports only work with single-account deployments.
wireguardPort: 0

# Enable PROXY protocol on TCP listeners.
proxyProtocol: false

# Optional pre-shared key for tunnels between proxy and peers.
preSharedKey: ""

# Whether this proxy can bind arbitrary UDP/TCP passthrough ports.
supportsCustomPorts: true

# Require a subdomain label in front of the cluster domain.
requireSubdomain: false

# Optional timeout caps.
timeouts:
  maxDial: ""
  maxSessionIdle: ""

# GeoLite2 database directory used by the proxy.
geolocation:
  dataDir: "/var/lib/netbird/geolocation"

# CrowdSec LAPI integration for per-service IP reputation checks.
crowdsec:
  apiUrl: ""
  apiKey: ""
  # Reference an existing secret with key NB_PROXY_CROWDSEC_API_KEY.
  existingSecret: ""

# Log level: debug, info, warn, error.
logLevel: "info"

service:
  type: ClusterIP
  annotations: {}
  # Main HTTPS port (proxy handles its own TLS).
  port: 443
  # Extra public L4 ports for NetBird Reverse Proxy services with custom ports.
  # Each entry adds a Service port and matching container port.
  extraPorts: []
  # - name: tcp-5432
  #   port: 5432
  #   protocol: TCP
  # - name: udp-51820
  #   port: 51820
  #   protocol: UDP

# Ingress for proxy.
# IMPORTANT: Requires TLS passthrough - the proxy manages its own certificates.
# For nginx-ingress: nginx.ingress.kubernetes.io/ssl-passthrough: "true"
# For Traefik: use IngressRouteTCP with TLS passthrough.
ingress:
  enabled: false
  className: ""
  annotations: {}

persistence:
  enabled: true
  storageClass: ""
  size: "100Mi"


# Management server target used by the proxy and token creator.
management:
  address: ""
  serviceSuffix: "management"
  appName: "management"
  containerName: "management"
  command: "/usr/local/bin/netbird-server"
  configPath: "/etc/netbird/config.yaml"
  kubectlImage: "bitnami/kubectl:latest"
