{{- if .Values.enabled }}
{{- range $name, $group := .Values.groups }}
{{- $enabled := true }}
{{- if hasKey $group "enabled" }}{{- $enabled = $group.enabled }}{{- end }}
{{- if $enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker.groupName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "worker.groupLabels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  replicas: {{ get $group "replicas" | default $.Values.replicas }}
  selector:
    matchLabels:
      {{- include "worker.groupSelectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "worker.groupSelectorLabels" (dict "root" $ "name" $name) | nindent 8 }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with (get $group "podLabels") }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/global-zulip: {{ toJson (get ($.Values.global | default dict) "zulip" | default dict) | sha256sum }}
        checksum/runtime-name: {{ include "worker.runtimeConfigMapName" $ | sha256sum }}
        checksum/app-config-name: {{ include "worker.appConfigMapName" $ | sha256sum }}
        checksum/config: {{ toJson $.Values.config | sha256sum }}
        checksum/secrets: {{ toJson $.Values.secrets | sha256sum }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with (get $group "podAnnotations") }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- $imagePullSecrets := include "worker.imagePullSecrets" $ | trim }}
      {{- if $imagePullSecrets }}
      imagePullSecrets:
        {{- $imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "worker.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- $initContainers := include "worker.initContainers" $ | trim }}
      {{- if $initContainers }}
      initContainers:
        {{- $initContainers | nindent 8 }}
      {{- end }}
      containers:
        {{- with $.Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: worker
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: {{ include "worker.image" $ | quote }}
          imagePullPolicy: {{ include "worker.imagePullPolicy" $ }}
          command:
            - /bin/bash
            - /opt/zulip-k8s/run-worker.sh
          volumeMounts:
            {{- include "worker.volumeMounts" $ | nindent 12 }}
          envFrom:
            {{- include "worker.envFrom" $ | nindent 12 }}
          env:
            {{- include "worker.secretEnv" $ | nindent 12 }}
            - name: ZULIP_K8S_ROLE
              value: worker
            - name: ZULIP_WORKER_GROUP
              value: {{ $name | quote }}
            {{- if get $group "queue" }}
            - name: ZULIP_WORKER_QUEUE
              value: {{ get $group "queue" | quote }}
            {{- if hasKey $group "workerNum" }}
            - name: ZULIP_WORKER_NUM
              value: {{ get $group "workerNum" | quote }}
            {{- end }}
            {{- else }}
            - name: ZULIP_WORKER_QUEUES
              value: {{ join " " (get $group "queues" | default $.Values.queues) | quote }}
            {{- end }}
          resources:
            {{- toYaml (get $group "resources" | default $.Values.resources) | nindent 12 }}
      volumes:
        {{- include "worker.podVolumes" $ | nindent 8 }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
