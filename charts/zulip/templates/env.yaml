apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zulip.envConfigMapName" . }}
  labels:
    {{- include "zulip.labels" . | nindent 4 }}
data:
  {{- include "zulip.envConfigData" . | nindent 2 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zulip.envSecretName" . }}
  labels:
    {{- include "zulip.labels" . | nindent 4 }}
type: Opaque
{{- $secretData := include "zulip.envSecretData" . | trim }}
{{- if $secretData }}
stringData:
  {{- $secretData | nindent 2 }}
{{- else }}
data: {}
{{- end }}
