apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zulip-juicefs-s3-data
  labels:
    app.kubernetes.io/name: zulip-juicefs-s3
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: zulip-juicefs-s3
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zulip-juicefs-s3
  labels:
    app.kubernetes.io/name: zulip-juicefs-s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zulip-juicefs-s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zulip-juicefs-s3
    spec:
      initContainers:
        - name: format
          image: juicedata/mount:ce-v1.3.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              mkdir -p /data/objects
              if [ ! -f /data/juicefs.db ]; then
                juicefs format --storage file --bucket /data/objects sqlite3:///data/juicefs.db zulip-e2e-uploads
              else
                echo "Reusing existing JuiceFS metadata at /data/juicefs.db"
              fi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: gateway
          image: juicedata/mount:ce-v1.3.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: zulip-juicefs-s3
          command:
            - sh
            - -ec
            - juicefs gateway --multi-buckets sqlite3:///data/juicefs.db 0.0.0.0:9000
          ports:
            - name: s3
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zulip-juicefs-s3-data
---
apiVersion: v1
kind: Service
metadata:
  name: zulip-juicefs-s3
  labels:
    app.kubernetes.io/name: zulip-juicefs-s3
spec:
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      protocol: TCP
  selector:
    app.kubernetes.io/name: zulip-juicefs-s3
---
