apiVersion: v1
kind: ConfigMap
metadata:
  name: zulip-juicefs-s3-tls
data:
  haproxy.cfg: |
    global
        log stdout format raw local0
        maxconn 2000

    defaults
        log global
        mode tcp
        option tcplog
        timeout connect 5s
        timeout client 1h
        timeout server 1h

    frontend s3_tls
        bind *:9443 ssl crt /tmp/tls.pem
        default_backend s3_plain

    backend s3_plain
        server s3 zulip-juicefs-s3:9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zulip-juicefs-s3-tls
  labels:
    app.kubernetes.io/name: zulip-juicefs-s3-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zulip-juicefs-s3-tls
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zulip-juicefs-s3-tls
    spec:
      containers:
        - name: haproxy
          image: haproxy:3.2-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              cat /etc/haproxy/tls/tls.crt /etc/haproxy/tls/tls.key >/tmp/tls.pem
              exec haproxy -f /usr/local/etc/haproxy/haproxy.cfg -db
          ports:
            - name: https
              containerPort: 9443
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
              readOnly: true
            - name: tls
              mountPath: /etc/haproxy/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: zulip-juicefs-s3-tls
        - name: tls
          secret:
            secretName: zulip-juicefs-s3-tls
---
apiVersion: v1
kind: Service
metadata:
  name: zulip-juicefs-s3-tls
  labels:
    app.kubernetes.io/name: zulip-juicefs-s3-tls
spec:
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
  selector:
    app.kubernetes.io/name: zulip-juicefs-s3-tls
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zulip-juicefs-create-buckets
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: amazon/aws-cli:2.24.13
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: zulip-juicefs-s3
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: zulip-juicefs-s3
                  key: MINIO_ROOT_PASSWORD
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          command:
            - sh
            - -ec
            - |
              until aws --endpoint-url http://zulip-juicefs-s3:9000 s3 ls >/dev/null 2>&1; do
                sleep 2
              done
              aws --endpoint-url http://zulip-juicefs-s3:9000 s3 mb s3://zulip-uploads || true
              aws --endpoint-url http://zulip-juicefs-s3:9000 s3 mb s3://zulip-avatars || true
              cat >/tmp/avatar-policy.json <<'JSON'
              {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::zulip-avatars/*"]}]}
              JSON
              aws --endpoint-url http://zulip-juicefs-s3:9000 s3api put-bucket-policy --bucket zulip-avatars --policy file:///tmp/avatar-policy.json
              aws --endpoint-url http://zulip-juicefs-s3:9000 s3 ls s3://zulip-uploads
              aws --endpoint-url http://zulip-juicefs-s3:9000 s3 ls s3://zulip-avatars
