suite: NetBird Microservice Unified Ingress
templates:
  - templates/ingress.yaml
release:
  name: nb
  namespace: default
tests:
  - it: is not rendered unless unified ingress mode is enabled
    asserts:
      - hasDocuments:
          count: 0

  - it: routes API, gRPC, websocket, relay, and dashboard paths on one host
    set:
      global.netbird.ingress.unified: true
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: nb-netbird
      - equal:
          path: spec.rules[0].host
          value: netbird.example.com
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 7
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: nb-management
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /management.ManagementService
      - equal:
          path: spec.rules[0].http.paths[3].path
          value: /signalexchange.SignalExchange
      - equal:
          path: spec.rules[0].http.paths[5].backend.service.name
          value: nb-relay
      - equal:
          path: spec.rules[0].http.paths[6].backend.service.name
          value: nb-dashboard

  - it: omits native gRPC paths from unified ingress when split gRPC ingress is enabled
    set:
      global.netbird.ingress.unified: true
      global.netbird.ingress.grpc.enabled: true
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 5
      - notContains:
          path: spec.rules[0].http.paths
          content:
            path: /management.ManagementService
          any: true
      - notContains:
          path: spec.rules[0].http.paths
          content:
            path: /signalexchange.SignalExchange
          any: true
      - equal:
          path: spec.rules[0].http.paths[4].backend.service.name
          value: nb-dashboard
