{{/* Dashboard ingress is skipped when unified ingress mode is enabled. */}}
{{- $values := .Values | toJson | fromJson -}}
{{- $globalIngress := dig "global" "netbird" "ingress" (dict) $values -}}
{{- $subchartIngress := .Values.ingress | default dict -}}
{{- $ingressValues := merge $subchartIngress $globalIngress -}}
{{- $tls := $ingressValues.tls | default dict -}}
{{- $ingress := dict
  "enabled" (and ($ingressValues.enabled | default false) (not ($globalIngress.unified | default false)))
  "host" (dig "global" "netbird" "fqdn" "" $values)
  "path" "/"
  "className" ($ingressValues.className | default "")
  "annotations" ($ingressValues.annotations | default dict)
  "tls" (dict "enabled" ($tls.enabled | default false) "secretName" ($tls.secretName | default ""))
-}}
{{- include "netbird-dashboard-lib.ingress" (dict "root" . "values" .Values "fullname" (include "dashboard.fullname" .) "labels" (include "dashboard.labels" .) "ingress" $ingress) }}
