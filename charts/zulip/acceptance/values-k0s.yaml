web:
  gateway:
    replicas: 3
  django:
    replicas: 3
  probeHost: 192.168.2.190.nip.io
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - host: 192.168.2.190.nip.io
        paths:
          - path: /
            pathType: Prefix
    tls: []
  tusd:
    enabled: true

worker:
  replicas: 3

redis:
  auth:
    password: set-secure-zulip-e2e-redis-password

rabbitmq:
  replicas: 1

cnpg:
  instances: 1
  sslmode: disable
  auth:
    password: set-secure-zulip-e2e-postgres-password
