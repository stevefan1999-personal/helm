# Dashboard configuration
enabled: true
replicas: 1

image:
  repository: "netbirdio/dashboard"
  tag: "v2.37.1"
  pullPolicy: IfNotPresent

securityContext: {}

service:
  type: ClusterIP
  # Dashboard v2.37.1+ runs nginx on port 80
  port: 80

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

# Ingress configuration
ingress:
  enabled: true
  className: ""
  annotations: {}
  tls:
    secretName: "netbird-tls"


# Optional explicit dashboard endpoint overrides. Parent charts normally derive these.
config:
  managementEndpoint: ""
  managementGrpcEndpoint: ""
  signalEndpoint: ""
  relayEndpoint: ""

# Optional explicit dashboard auth overrides. Parent charts normally derive these.
auth:
  authority: ""
  audience: ""
  clientId: ""
  clientSecret: ""
  supportedScopes: ""
  tokenSource: ""

secret:
  enabled: true
