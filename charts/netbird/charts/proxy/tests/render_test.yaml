suite: NetBird Proxy Wrapper
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/pvc.yaml
  - templates/secrets.yaml
  - templates/token-job.yaml
  - templates/ingress.yaml
  - templates/rbac.yaml
release:
  name: nb
  namespace: default
tests:
  - it: renders the proxy deployment through the shared library primitive
    template: templates/deployment.yaml
    set:
      enabled: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: nb-proxy
      - equal:
          path: spec.template.spec.containers[0].name
          value: proxy
      - equal:
          path: spec.template.spec.serviceAccountName
          value: nb-proxy
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NB_PROXY_MANAGEMENT_ADDRESS
            value: http://nb-management:443
      - contains:
          path: spec.template.spec.volumes
          content:
            name: certs
            persistentVolumeClaim:
              claimName: nb-proxy-certs

  - it: renders a service targeting the proxy pod
    template: templates/service.yaml
    set:
      enabled: true
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].targetPort
          value: https
      - equal:
          path: spec.ports[1].targetPort
          value: health
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: proxy
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: nb

  - it: exposes ACME http-01 and extra L4 ports
    template: templates/service.yaml
    values:
      - extra-ports-values.yaml
    asserts:
      - contains:
          path: spec.ports
          content:
            name: acme-http
            port: 80
            targetPort: acme-http
            protocol: TCP
      - contains:
          path: spec.ports
          content:
            name: tcp-5432
            port: 5432
            targetPort: tcp-5432
            protocol: TCP
      - contains:
          path: spec.ports
          content:
            name: udp-51820
            port: 51820
            targetPort: udp-51820
            protocol: UDP

  - it: adds matching container ports for ACME http-01 and extra L4 ports
    template: templates/deployment.yaml
    values:
      - extra-ports-values.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: acme-http
            containerPort: 80
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: tcp-5432
            containerPort: 5432
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: udp-51820
            containerPort: 51820
            protocol: UDP

  - it: creates lease RBAC for in-cluster ACME certificate locking
    template: templates/rbac.yaml
    set:
      enabled: true
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.name
          value: nb-proxy-acme-lease
      - equal:
          path: rules[0].apiGroups[0]
          value: coordination.k8s.io
      - equal:
          path: rules[0].resources[0]
          value: leases
      - equal:
          path: rules[0].verbs
          value:
            - get
            - create
            - update

  - it: skips lease RBAC when disabled
    template: templates/rbac.yaml
    set:
      enabled: true
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders cert persistence when enabled
    template: templates/pvc.yaml
    set:
      enabled: true
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: nb-proxy-certs
      - equal:
          path: spec.resources.requests.storage
          value: 100Mi

  - it: renders a static token secret when token is provided
    template: templates/secrets.yaml
    set:
      enabled: true
      token: nbx_static
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: nb-proxy-proxy-secrets
      - equal:
          path: stringData.NB_PROXY_TOKEN
          value: nbx_static

  - it: creates a token job against the management deployment by default
    template: templates/token-job.yaml
    set:
      enabled: true
    documentSelector:
      path: metadata.name
      value: nb-proxy-create-token
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVER_DEPLOY
            value: nb-management
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVER_CONTAINER
            value: management
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROXY_DEPLOY
            value: nb-proxy
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WAIT_FOR_AVAILABLE
            value: "true"

  - it: skips the generated token job when an existing secret is supplied
    template: templates/token-job.yaml
    set:
      enabled: true
      existingSecret: existing-proxy-token
    asserts:
      - hasDocuments:
          count: 0

  - it: renders passthrough ingress for the proxy domain
    template: templates/ingress.yaml
    set:
      enabled: true
      domain: proxy.example.test
      ingress.enabled: true
      global.netbird.ingress.className: nginx
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/ssl-passthrough"]
          value: "true"
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: proxy.example.test
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: nb-proxy
