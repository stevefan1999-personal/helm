{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "web.secretName" . }}
  labels:
    {{- include "web.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.secrets }}
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- else }}
data: {}
{{- end }}
{{- end }}
