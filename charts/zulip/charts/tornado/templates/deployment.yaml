{{- if .Values.enabled }}
{{- if gt (int .Values.replicasPerShard) 1 }}
{{- fail "tornado.replicasPerShard must be 1 because each Tornado port owns in-memory event queues" }}
{{- end }}
{{- range $port := .Values.ports }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tornado.portName" (dict "root" $ "port" $port) }}
  labels:
    {{- include "tornado.labels" $ | nindent 4 }}
    app.kubernetes.io/tornado-port: {{ $port | quote }}
spec:
  replicas: {{ $.Values.replicasPerShard }}
  selector:
    matchLabels:
      {{- include "tornado.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/tornado-port: {{ $port | quote }}
  template:
    metadata:
      labels:
        {{- include "tornado.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/tornado-port: {{ $port | quote }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/global-zulip: {{ toJson (get ($.Values.global | default dict) "zulip" | default dict) | sha256sum }}
        checksum/runtime-name: {{ include "tornado.runtimeConfigMapName" $ | sha256sum }}
        checksum/app-config-name: {{ include "tornado.appConfigMapName" $ | sha256sum }}
        checksum/config: {{ toJson $.Values.config | sha256sum }}
        checksum/secrets: {{ toJson $.Values.secrets | sha256sum }}
        checksum/ports: {{ join "," (toStrings $.Values.ports) | sha256sum }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- $imagePullSecrets := include "tornado.imagePullSecrets" $ | trim }}
      {{- if $imagePullSecrets }}
      imagePullSecrets:
        {{- $imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tornado.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- $initContainers := include "tornado.initContainers" $ | trim }}
      {{- if $initContainers }}
      initContainers:
        {{- $initContainers | nindent 8 }}
      {{- end }}
      containers:
        {{- with $.Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: tornado
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: {{ include "tornado.image" $ | quote }}
          imagePullPolicy: {{ include "tornado.imagePullPolicy" $ }}
          command:
            - /bin/bash
            - /opt/zulip-k8s/run-tornado.sh
          ports:
            - name: tornado
              containerPort: {{ $port }}
              protocol: TCP
          volumeMounts:
            {{- include "tornado.volumeMounts" $ | nindent 12 }}
          envFrom:
            {{- include "tornado.envFrom" $ | nindent 12 }}
          env:
            {{- include "tornado.secretEnv" $ | nindent 12 }}
            - name: ZULIP_K8S_ROLE
              value: tornado
            - name: ZULIP_K8S_TORNADO_PORT
              value: {{ $port | quote }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          {{- if $.Values.startupProbe.enabled }}
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - timeout {{ $.Values.startupProbe.timeoutSeconds }} bash -c '</dev/tcp/127.0.0.1/${ZULIP_K8S_TORNADO_PORT}'
            initialDelaySeconds: {{ $.Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.startupProbe.timeoutSeconds }}
            successThreshold: {{ $.Values.startupProbe.successThreshold }}
            failureThreshold: {{ $.Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if $.Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - timeout {{ $.Values.livenessProbe.timeoutSeconds }} bash -c '</dev/tcp/127.0.0.1/${ZULIP_K8S_TORNADO_PORT}'
            initialDelaySeconds: {{ $.Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.livenessProbe.timeoutSeconds }}
            successThreshold: {{ $.Values.livenessProbe.successThreshold }}
            failureThreshold: {{ $.Values.livenessProbe.failureThreshold }}
          {{- end }}
        {{- if $.Values.localhostProxy.enabled }}
        - name: tornado-proxy
          image: {{ printf "%s:%s" $.Values.localhostProxy.image.repository $.Values.localhostProxy.image.tag | quote }}
          imagePullPolicy: {{ $.Values.localhostProxy.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              exec socat "TCP-LISTEN:${ZULIP_K8S_TORNADO_PROXY_PORT},fork,reuseaddr" "TCP:127.0.0.1:${ZULIP_K8S_TORNADO_PORT}"
          ports:
            - name: tornado-proxy
              containerPort: {{ add (int $port) (int $.Values.localhostProxy.portOffset) }}
              protocol: TCP
          env:
            - name: ZULIP_K8S_TORNADO_PORT
              value: {{ $port | quote }}
            - name: ZULIP_K8S_TORNADO_PROXY_PORT
              value: {{ add (int $port) (int $.Values.localhostProxy.portOffset) | quote }}
          resources:
            {{- toYaml $.Values.localhostProxy.resources | nindent 12 }}
        {{- end }}
      volumes:
        {{- include "tornado.podVolumes" $ | nindent 8 }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
