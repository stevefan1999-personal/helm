{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "web.configMapName" . }}
  labels:
    {{- include "web.labels" . | nindent 4 }}
{{- if .Values.config }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- else }}
data: {}
{{- end }}
{{- end }}
