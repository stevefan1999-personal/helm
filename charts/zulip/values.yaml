extraObjects: []

## CloudNativePG settings, see [Requirements](#Requirements).
## Set cnpg.enabled to false and configure externalPostgresql to use a pre-existing server.
cnpg:
  enabled: true
  ## Override the generated CNPG Cluster name. Defaults to "<fullname>-postgresql".
  name: ""
  instances: 1
  ## Vanilla CloudNativePG-compatible PostgreSQL image. Zulip falls back to
  ## PostgreSQL built-in English full-text search when PGroonga/tsearch files are
  ## not installed in the database image.
  imageName: "ghcr.io/cloudnative-pg/postgresql:14"
  imagePullPolicy: IfNotPresent
  sslmode: prefer
  ## Optional list of image pull secrets for the CNPG pods.
  imagePullSecrets: []
  auth:
    username: zulip
    database: zulip
    ## If empty and existingSecret is not set, CNPG generates the application user secret.
    password: ""
    ## Reference an existing Secret with username/password keys.
    existingSecret: ""
    usernameKey: username
    passwordKey: password
  initdb:
    ## Zulip's upstream database bootstrap uses UTF8 and C.UTF-8 locales.
    encoding: UTF8
    localeCollate: C.UTF-8
    localeCType: C.UTF-8
    ## Extra SQL statements to run in the application database at cluster init.
    postInitApplicationSQL: []
  pgroonga:
    ## Optional multilingual full-text search backend. This only works when the
    ## PostgreSQL image or another CNPG-supported extension delivery mechanism
    ## already contains PGroonga binaries/control files.
    enabled: false
    ## Add CREATE EXTENSION to bootstrap.initdb.postInitApplicationSQL.
    createExtension: true
    ## Add SETTING_USING_PGROONGA=True for the Zulip app when enabled.
    configureZulip: true
  storage:
    size: 10Gi
    storageClass: ""
  walStorage:
    enabled: false
    size: 10Gi
    storageClass: ""
  resources: {}
  monitoring:
    enablePodMonitor: false
  backup: {}
  postgresql: {}
  inheritedMetadata: {}
  managed:
    roles: []

## RabbitMQ Cluster Operator settings, see [Requirements](#Requirements).
## Set rabbitmq.enabled to false and configure externalRabbitmq to use a pre-existing server.
rabbitmq:
  enabled: true
  ## Override the generated RabbitmqCluster name. Defaults to "<fullname>-rabbitmq".
  name: ""
  replicas: 1
  image: "rabbitmq:4.1.3-management"
  service:
    type: ClusterIP
  persistence:
    storage: 10Gi
    storageClassName: ""
  resources: {}
  rabbitmq:
    additionalConfig: ""
    additionalPlugins: []
    envConfig: ""
  override: {}
  tls: {}
  ## Secret created by the operator for the default user. Defaults to "<rabbitmq.name>-default-user".
  defaultUserSecret: ""

## Memcached settings, see [Requirements](#Requirements).
## This chart renders a lightweight in-chart Deployment/Service when enabled.
## Set memcached.enabled to false and configure externalMemcached to use a pre-existing server.
memcached:
  enabled: true
  image:
    repository: memcached
    tag: "1.6-alpine"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 11211
    annotations: {}
  resources: {}
  podLabels: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  memcachedUsername: "zulip@localhost"
  ## Zulip supports a password env; vanilla Memcached has no auth by default.
  memcachedPassword: ""

## Redis settings, see [Requirements].
## This chart renders a lightweight in-chart Deployment/Service when enabled.
## Set redis.enabled to false and configure externalRedis to use a pre-existing server.
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 6379
    annotations: {}
  auth:
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: redis-password
  persistence:
    enabled: false
    accessMode: ReadWriteMany
    size: 8Gi
    storageClass: ""
  resources: {}
  podLabels: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

## External PostgreSQL configuration.
## Used when cnpg.enabled is set to false.
externalPostgresql:
  host: ""
  port: 5432
  database: "zulip"
  user: "zulip"
  ## password supports both scalar values and valueFrom maps.
  # password: ""
  sslmode: ""

## External RabbitMQ configuration.
## Used when rabbitmq.enabled is set to false.
externalRabbitmq:
  host: ""
  port: 5672
  user: "zulip"
  ## password supports both scalar values and valueFrom maps.
  # password: ""

## External Memcached configuration.
## Used when memcached.enabled is set to false.
externalMemcached:
  host: ""
  port: 11211
  user: ""
  ## password supports both scalar values and valueFrom maps.
  # password: ""

## External Redis configuration.
## Used when redis.enabled is set to false.
externalRedis:
  host: ""
  port: 6379
  ## password supports both scalar values and valueFrom maps.
  # password: ""
