---
zulip:
  settings:
    administratorEmail: admin@example.com
    externalHost: zulip.example.com
  secrets:
    secretKey: test-secret-key
cnpg:
  enabled: false
rabbitmq:
  enabled: false
memcached:
  enabled: false
redis:
  enabled: false
externalPostgresql:
  host: pg.example.com
  port: 5432
  user: zulip
  database: zulip
  password: external-pg-password
  sslmode: require
externalRabbitmq:
  host: rabbitmq.example.com
  port: 5672
  user: zulip
  password: external-rabbitmq-password
externalMemcached:
  host: memcached.example.com
  port: 11211
  user: zulip
  password: external-memcached-password
externalRedis:
  host: redis.example.com
  port: 6379
  password: external-redis-password
