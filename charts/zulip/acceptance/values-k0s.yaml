global:
  zulip:
    name: zulip-e2e

zulip:
  settings:
    externalHost: 192.168.2.190.nip.io
    externalUriScheme: "https://"
    administratorEmail: admin@example.net
  secrets:
    secretKey: set-secure-zulip-e2e-secret-key
    sharedSecret: set-secure-zulip-e2e-shared-secret
    avatarSalt: set-secure-zulip-e2e-avatar-salt
  objectStorage:
    enabled: true
    uploadsBucket: zulip-uploads
    avatarBucket: zulip-avatars
    endpointUrl: https://zulip-juicefs-s3-tls
    region: us-east-1
    addressingStyle: path
    skipChecksum: true
    avatarPublicUrlPrefix: https://192.168.2.190.nip.io/s3-avatar/
