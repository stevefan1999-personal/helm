{{- $tc := dict
  "deployment" (printf "%s-%s" .Release.Name (.Values.management.serviceSuffix | default "management"))
  "appName" (.Values.management.appName | default "management")
  "container" (.Values.management.containerName | default "management")
  "command" (.Values.management.command | default "/usr/local/bin/netbird-server")
  "configPath" (.Values.management.configPath | default "/etc/netbird/config.yaml")
  "kubectlImage" (.Values.management.kubectlImage | default "bitnami/kubectl:latest")
-}}
{{- include "netbird-proxy-lib.tokenJob" (dict "root" . "values" .Values "fullname" (include "proxy.fullname" .) "labels" (include "proxy.labels" .) "selectorLabels" (include "proxy.selectorLabels" .) "proxySecretName" (printf "%s-proxy-secrets" (include "proxy.fullname" .)) "tokenCreator" $tc) }}
