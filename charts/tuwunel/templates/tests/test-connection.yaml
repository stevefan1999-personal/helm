{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tuwunel.fullname" . }}-test-connection
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      command:
        - sh
        - -ec
        - |
          curl -fsS http://{{ include "tuwunel.fullname" . }}:{{ .Values.service.port }}/_matrix/client/versions | grep -q 'versions'
          curl -fsS http://{{ include "tuwunel.fullname" . }}:{{ .Values.service.port }}/.well-known/matrix/client | grep -q 'm.homeserver'
          {{- if .Values.cinny.enabled }}
          curl -fsS http://{{ include "tuwunel.cinnyName" . }}:{{ .Values.cinny.service.port }}/config.json | grep -q 'homeserverList'
          {{- if .Values.cinny.homeserverProxy.enabled }}
          curl -fsS http://{{ include "tuwunel.cinnyHomeserverProxyName" . }}:{{ .Values.cinny.homeserverProxy.service.port }}/_matrix/client/versions | grep -q 'versions'
          {{- end }}
          {{- end }}
{{- end }}
